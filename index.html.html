<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Product Store</title>
  <meta name="description" content="Responsive product store with filters, search and a saved shopping cart.">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .product-img { height: 180px; object-fit: contain; padding: 1rem; background: #fff; }
    .product-title { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .cart-img { width: 56px; height: 56px; object-fit: contain; background: #fff; }
  </style>
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark bg-dark sticky-top">
    <div class="container">
      <span class="navbar-brand fw-bold">🛍️ Product Store</span>
      <button class="btn btn-warning position-relative" type="button"
              data-bs-toggle="offcanvas" data-bs-target="#cart-panel" aria-controls="cart-panel">
        Cart
        <span id="cart-count" class="badge text-bg-dark ms-1">0</span>
      </button>
    </div>
  </nav>

  <main class="container py-4">
    <!-- Filters -->
    <div class="row g-2 mb-4">
      <div class="col-12 col-md-8">
        <label for="search" class="visually-hidden">Search products</label>
        <input id="search" class="form-control" type="search" placeholder="Search products...">
      </div>
      <div class="col-12 col-md-4">
        <label for="category" class="visually-hidden">Filter by category</label>
        <select id="category" class="form-select">
          <option value="all">All categories</option>
        </select>
      </div>
    </div>

    <div id="status" role="status" aria-live="polite" class="text-muted mb-3">Loading products...</div>
    <div id="error" role="alert" class="alert alert-danger d-none"></div>

    <!-- Product grid -->
    <div id="grid" class="row row-cols-1 row-cols-sm-2 row-cols-lg-4 g-4"></div>
  </main>

  <!-- Cart panel -->
  <div class="offcanvas offcanvas-end" tabindex="-1" id="cart-panel" aria-labelledby="cart-title">
    <div class="offcanvas-header">
      <h2 class="offcanvas-title h5" id="cart-title">Your Cart</h2>
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close cart"></button>
    </div>
    <div class="offcanvas-body d-flex flex-column">
      <div id="cart-items" class="flex-grow-1"></div>
      <div class="border-top pt-3">
        <div class="d-flex justify-content-between fw-bold fs-5 mb-3">
          <span>Total</span><span id="cart-total">$0.00</span>
        </div>
        <button id="clear-cart" class="btn btn-outline-danger w-100" type="button">Clear cart</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // ---------- Setup ----------
    const API = "https://fakestoreapi.com";
    const CART_KEY = "product-store-cart";

    const gridEl = document.getElementById("grid");
    const statusEl = document.getElementById("status");
    const errorEl = document.getElementById("error");
    const searchEl = document.getElementById("search");
    const categoryEl = document.getElementById("category");
    const cartItemsEl = document.getElementById("cart-items");
    const cartCountEl = document.getElementById("cart-count");
    const cartTotalEl = document.getElementById("cart-total");

    let products = [];
    let cart = loadCart(); // { [id]: { id, title, price, image, qty } }

    // ---------- Cart storage (localStorage) ----------
    function loadCart() {
      try {
        return JSON.parse(localStorage.getItem(CART_KEY)) || {};
      } catch (e) {
        return {}; // storage blocked or corrupted -> start with an empty cart
      }
    }
    function saveCart() {
      try {
        localStorage.setItem(CART_KEY, JSON.stringify(cart));
      } catch (e) { /* ignore: cart still works for this visit */ }
    }

    const money = (n) => `$${n.toFixed(2)}`;

    // ---------- Load data ----------
    async function init() {
      try {
        const [prodRes, catRes] = await Promise.all([
          fetch(`${API}/products`),
          fetch(`${API}/products/categories`)
        ]);
        if (!prodRes.ok || !catRes.ok) throw new Error("The store could not be loaded. Please try again later.");
        products = await prodRes.json();
        const categories = await catRes.json();

        categories.forEach((c) => {
          const opt = document.createElement("option");
          opt.value = c;
          opt.textContent = c.charAt(0).toUpperCase() + c.slice(1);
          categoryEl.appendChild(opt);
        });

        renderProducts();
        renderCart();
      } catch (err) {
        statusEl.textContent = "";
        errorEl.textContent = err instanceof TypeError
          ? "Network error. Check your internet connection and refresh."
          : err.message;
        errorEl.classList.remove("d-none");
      }
    }

    // ---------- Products ----------
    function renderProducts() {
      const term = searchEl.value.trim().toLowerCase();
      const cat = categoryEl.value;

      const list = products.filter((p) =>
        (cat === "all" || p.category === cat) &&
        p.title.toLowerCase().includes(term)
      );

      gridEl.innerHTML = "";
      statusEl.textContent = list.length
        ? `Showing ${list.length} product${list.length === 1 ? "" : "s"}`
        : "No products match your search.";

      list.forEach((p) => {
        const col = document.createElement("div");
        col.className = "col";
        col.innerHTML = `
          <div class="card h-100 shadow-sm">
            <img class="card-img-top product-img" alt="">
            <div class="card-body d-flex flex-column">
              <h2 class="h6 product-title"></h2>
              <p class="text-muted small mb-1 category"></p>
              <p class="fw-bold fs-5 mt-auto mb-2 price"></p>
              <button class="btn btn-dark w-100 add-btn" type="button">Add to cart</button>
            </div>
          </div>`;
        const img = col.querySelector("img");
        img.src = p.image;
        img.alt = p.title;
        col.querySelector(".product-title").textContent = p.title;
        col.querySelector(".category").textContent = p.category;
        col.querySelector(".price").textContent = money(p.price);
        col.querySelector(".add-btn").addEventListener("click", () => addToCart(p));
        gridEl.appendChild(col);
      });
    }

    // ---------- Cart actions ----------
    function addToCart(p) {
      if (cart[p.id]) {
        cart[p.id].qty += 1;
      } else {
        cart[p.id] = { id: p.id, title: p.title, price: p.price, image: p.image, qty: 1 };
      }
      saveCart();
      renderCart();
    }
    function changeQty(id, delta) {
      if (!cart[id]) return;
      cart[id].qty += delta;
      if (cart[id].qty <= 0) delete cart[id];
      saveCart();
      renderCart();
    }
    function removeItem(id) {
      delete cart[id];
      saveCart();
      renderCart();
    }

    function renderCart() {
      const items = Object.values(cart);
      cartItemsEl.innerHTML = "";

      if (items.length === 0) {
        cartItemsEl.innerHTML = '<p class="text-muted">Your cart is empty.</p>';
      }

      items.forEach((item) => {
        const row = document.createElement("div");
        row.className = "d-flex gap-2 align-items-center border-bottom py-2";
        row.innerHTML = `
          <img class="cart-img rounded border" alt="">
          <div class="flex-grow-1">
            <div class="small fw-semibold cart-title"></div>
            <div class="small text-muted cart-price"></div>
            <div class="btn-group btn-group-sm mt-1" role="group">
              <button type="button" class="btn btn-outline-secondary minus" aria-label="Decrease quantity">−</button>
              <span class="btn btn-light disabled qty"></span>
              <button type="button" class="btn btn-outline-secondary plus" aria-label="Increase quantity">+</button>
            </div>
          </div>
          <button type="button" class="btn btn-sm btn-outline-danger remove" aria-label="Remove item">✕</button>`;
        const img = row.querySelector("img");
        img.src = item.image;
        img.alt = item.title;
        row.querySelector(".cart-title").textContent = item.title;
        row.querySelector(".cart-price").textContent = money(item.price);
        row.querySelector(".qty").textContent = item.qty;
        row.querySelector(".minus").addEventListener("click", () => changeQty(item.id, -1));
        row.querySelector(".plus").addEventListener("click", () => changeQty(item.id, 1));
        row.querySelector(".remove").addEventListener("click", () => removeItem(item.id));
        cartItemsEl.appendChild(row);
      });

      const count = items.reduce((sum, i) => sum + i.qty, 0);
      const total = items.reduce((sum, i) => sum + i.qty * i.price, 0);
      cartCountEl.textContent = count;
      cartTotalEl.textContent = money(total);
    }

    // ---------- Events ----------
    searchEl.addEventListener("input", renderProducts);
    categoryEl.addEventListener("change", renderProducts);
    document.getElementById("clear-cart").addEventListener("click", () => {
      cart = {};
      saveCart();
      renderCart();
    });

    init();
  </script>
</body>
</html>
